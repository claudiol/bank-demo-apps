<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::title}, ~{::body})}">
<head>
  <title th:fragment="title">Overview · Northwater</title>
</head>
<body>
  <th:block th:fragment="body">
    <p class="eyebrow">Overview</p>
    <h1 th:text="|${greeting}, ${user.firstName}|">Hello</h1>
    <p class="dateline" th:text="${todayLong}">Today</p>
    <p class="balance-label" id="available-label">Available</p>
    <p class="figure" id="available-total" th:attr="data-cents=${totalCents}" aria-labelledby="available-label"><span class="currency">$</span><th:block th:text="${totalDollars}">0</th:block><span class="cents" th:text="|.${centsPart}|">.00</span></p>
    <p class="sub" th:text="${summary}">Summary</p>
    <div class="actions">
      <a class="btn" href="/transfer">Move money</a>
      <a class="btn btn-secondary" href="/pay">Pay a bill</a>
    </div>
    <section class="section">
      <h2>Accounts</h2>
      <div class="account-list">
        <a class="account-row" th:each="account : ${accounts}" th:href="|/accounts/${account.id}|">
          <span class="name" th:text="${account.nickname}">Checking</span>
          <span class="meta" th:text="|${account.kindLabel} · ${account.mask}|">Checking</span>
          <span class="balance" th:text="${account.balance}">$0.00</span>
        </a>
      </div>
    </section>
    <section class="section">
      <h2>Recent activity</h2>
      <div th:if="${!transactions.isEmpty()}" th:replace="~{ledger :: table}"></div>
      <p class="empty" th:if="${transactions.isEmpty()}">No activity yet.</p>
    </section>
  </th:block>
</body>
</html>
