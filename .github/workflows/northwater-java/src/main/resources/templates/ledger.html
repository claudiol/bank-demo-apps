<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
  <div class="ledger-wrap" th:fragment="table">
    <table class="ledger">
      <caption class="sr-only" th:text="${caption}">Activity</caption>
      <thead>
        <tr>
          <th scope="col">Date</th>
          <th scope="col">Description</th>
          <th class="desktop-col" scope="col" th:if="${showAccount}">Account</th>
          <th class="desktop-col" scope="col" th:if="${showCategory}">Category</th>
          <th class="num" scope="col">Amount</th>
          <th class="num desktop-col" scope="col" th:if="${showBalance}">Balance</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="tx : ${transactions}">
          <td class="date" th:text="${tx.posted}">Date</td>
          <td class="what">
            <a class="desc" th:if="${linkDescription}" th:href="|/accounts/${tx.accountId}|" th:text="${tx.description}">Description</a>
            <div class="desc" th:unless="${linkDescription}" th:text="${tx.description}">Description</div>
            <div class="memo" th:if="${!#strings.isEmpty(tx.memo)}" th:text="${tx.memo}">Memo</div>
            <div class="row-meta">
              <span th:if="${showAccount}" th:text="${tx.account}">Account</span>
              <span th:if="${showCategory}" th:text="${tx.category}">Category</span>
              <span class="money" th:if="${showBalance}" th:text="|Balance ${tx.balance}|">Balance</span>
            </div>
          </td>
          <td class="desktop-col" th:if="${showAccount}" th:text="${tx.account}">Account</td>
          <td class="desktop-col" th:if="${showCategory}" th:text="${tx.category}">Category</td>
          <td class="num" th:classappend="${tx.direction}" th:text="${tx.amount}">$0.00</td>
          <td class="num desktop-col" th:if="${showBalance}" th:text="${tx.balance}">$0.00</td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
