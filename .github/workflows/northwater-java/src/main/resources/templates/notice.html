<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::title}, ~{::body})}">
<head>
  <title th:fragment="title" th:text="${pageTitle}">Northwater</title>
</head>
<body>
  <th:block th:fragment="body">
    <th:block th:if="${user != null}">
      <p class="eyebrow">Northwater</p>
      <h1 th:text="${heading}">Heading</h1>
      <p th:text="${message}">Message</p>
      <p class="actions"><a class="btn" href="/">Overview</a></p>
    </th:block>
    <div class="gate" th:unless="${user != null}">
      <div class="panel">
        <p class="eyebrow">Northwater</p>
        <h1 th:text="${heading}">Heading</h1>
        <p th:text="${message}">Message</p>
        <p class="actions"><a class="btn" href="/">Sign in</a></p>
      </div>
    </div>
  </th:block>
</body>
</html>
