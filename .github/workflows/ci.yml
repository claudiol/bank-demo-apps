name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: northwater
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            northwater/requirements.txt
            northwater/requirements-dev.txt
      - run: pip install -r requirements.txt
      - run: mkdir -p reports && pip freeze > reports/requirements.lock
      - run: pip install -r requirements-dev.txt "cyclonedx-bom==7.5.0"
      - run: cyclonedx-py requirements reports/requirements.lock --output-file reports/sbom.cdx.json --output-reproducible
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: bandit -c pyproject.toml -r app.py test_bank.py
      - run: python test_bank.py
      - name: Grype report
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL https://github.com/anchore/grype/releases/download/v0.121.0/grype_0.121.0_linux_amd64.tar.gz | tar -xz -C "$HOME/.local/bin" grype
          "$HOME/.local/bin/grype" "sbom:reports/sbom.cdx.json" -o table
          "$HOME/.local/bin/grype" "sbom:reports/sbom.cdx.json" -o json --file reports/grype.json
      - uses: actions/upload-artifact@v4
        with:
          name: python-supply-chain
          path: |
            northwater/reports/sbom.cdx.json
            northwater/reports/grype.json
          if-no-files-found: error

  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: northwater-java
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: northwater-java/pom.xml
      - run: mvn -B verify
      - name: Shaded jar serves the sign-in page
        run: |
          log=$(mktemp)
          db=$(mktemp)
          NORTHWATER_DB="$db" java --enable-native-access=ALL-UNNAMED -jar target/northwater-1.0.0.jar >"$log" 2>&1 &
          pid=$!
          trap 'kill "$pid" >/dev/null 2>&1 || true' EXIT
          ready=
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ | grep -q "Sign in"; then
              ready=yes
              break
            fi
            sleep 1
          done
          if [ "$ready" != yes ]; then
            cat "$log"
            exit 1
          fi
      - name: Grype report
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL https://github.com/anchore/grype/releases/download/v0.121.0/grype_0.121.0_linux_amd64.tar.gz | tar -xz -C "$HOME/.local/bin" grype
          "$HOME/.local/bin/grype" "sbom:target/bom.json" -o table
          "$HOME/.local/bin/grype" "sbom:target/bom.json" --fail-on high -o json --file target/grype.json
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('northwater-java/target/bom.json') != ''
        with:
          name: java-supply-chain
          path: |
            northwater-java/target/bom.json
            northwater-java/target/grype.json
          if-no-files-found: error

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C "$HOME/.local/bin" gitleaks
          "$HOME/.local/bin/gitleaks" detect --source . --redact --exit-code 1

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v5.0.0
