<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::title}, ~{::body})}">
<head>
  <title th:fragment="title">Review · Northwater</title>
</head>
<body>
  <th:block th:fragment="body">
    <article class="slip">
      <p class="eyebrow" th:text="${review.eyebrow}">Review</p>
      <h1 th:text="${review.headline}">Amount</h1>
      <dl class="facts">
        <div th:each="line : ${review.lines}">
          <dt th:text="${line.label}">Label</dt>
          <dd th:text="${line.value}">Value</dd>
        </div>
      </dl>
      <p class="hint" th:text="${review.note}">Note</p>
      <form method="post" action="/confirm" data-once>
        <input type="hidden" name="csrf" th:value="${csrf}">
        <input type="hidden" name="nonce" th:value="${review.nonce}">
        <div class="actions">
          <button class="btn" type="submit" th:text="${review.confirmLabel}">Confirm</button>
          <a class="btn btn-secondary" th:href="${review.editHref}">Edit details</a>
        </div>
      </form>
    </article>
  </th:block>
</body>
</html>
