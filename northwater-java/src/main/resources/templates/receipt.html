<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::title}, ~{::body})}">
<head>
  <title th:fragment="title" th:text="|${receipt.confirmation} · Northwater|">Receipt · Northwater</title>
</head>
<body>
  <th:block th:fragment="body">
    <article class="slip">
      <p class="eyebrow">Posted</p>
      <h1 th:text="${receipt.headline}">Posted</h1>
      <p class="confirmation" th:text="${receipt.confirmation}">NW-00000000</p>
      <dl class="facts">
        <div th:each="line : ${receipt.lines}">
          <dt th:text="${line.label}">Label</dt>
          <dd th:text="${line.value}">Value</dd>
        </div>
      </dl>
      <div class="actions">
        <a class="btn" href="/">Done</a>
        <a class="btn btn-secondary" th:href="|/accounts/${receipt.fromId}|">View account</a>
      </div>
    </article>
  </th:block>
</body>
</html>
